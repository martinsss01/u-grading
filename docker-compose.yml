services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ugrading
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password@db:5432/ugrading
      # Extra allowed CORS origin(s), comma-separated — e.g. a cloudflared/ngrok
      # tunnel URL, so a phone hitting the API through the tunnel isn't blocked.
      EXTRA_CORS_ORIGINS: ${EXTRA_CORS_ORIGINS:-}
    depends_on:
      - db

  frontend:
    build: ./frontend
    command: node_modules/.bin/next dev -p 3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3001:3001"
    environment:
      # Always the local API — this is what login and the rest of the app
      # use, and it must keep working whether or not any tunnel is up.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      # Backend tunnel URL (see EXTRA_CORS_ORIGINS above), used ONLY by the
      # phone-scan page (src/lib/scanApi.ts) so the phone isn't calling its
      # own localhost. Leave unset outside of scan testing.
      NEXT_PUBLIC_SCAN_API_URL: ${NEXT_PUBLIC_SCAN_API_URL:-}
      # The origin a phone should open for the QR "Escanear" link — a
      # frontend tunnel URL when testing; falls back to window.location.origin.
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-}
    depends_on:
      - backend

volumes:
  postgres_data:
